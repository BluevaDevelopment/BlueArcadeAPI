name: Publish

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Verify release
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish to repo.blueva.net
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: blueva-repo
          server-username: BLUEVA_REPO_USERNAME
          server-password: BLUEVA_REPO_SECRET
      # A tag must match the pom version, so the published artifact is exactly what was tagged.
      - name: Check version
        if: github.ref_type == 'tag'
        run: |
          POM_VERSION="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$POM_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom version $POM_VERSION"
            exit 1
          fi
      - name: Publish
        run: ./mvnw -B deploy
        env:
          BLUEVA_REPO_USERNAME: ${{ secrets.BLUEVA_REPO_USERNAME }}
          BLUEVA_REPO_SECRET: ${{ secrets.BLUEVA_REPO_SECRET }}
